// Android build of the portable SDL3 Icy Tower (see docs/port/ANDROID.md).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // the version SDL 3.4's android-project template is built with
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
